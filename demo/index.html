<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chronexa: modern date and time toolkit with explicit time zones</title>
    <meta
      name="description"
      content="Immutable DateTime, strict parsing, explicit time zones and DST handling, durations, intervals, business days and recurrence. Zero dependencies."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%2316171d%27/%3E%3Cpath d=%27M16 8v8.5l5 3%27 fill=%27none%27 stroke=%27%23ff9a3c%27 stroke-width=%273.4%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E"
    />
    <script>
      // A visitor's own choice (the theme toggle) wins; otherwise follow the system.
      try {
        var choice = localStorage.getItem("chronexa-site:theme");
        document.documentElement.dataset.theme =
          choice === "light" || choice === "dark"
            ? choice
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
      // The page is prerendered as the landing page; hide it until a docs deep link renders.
      document.documentElement.dataset.view =
        location.hash.indexOf("#/docs") === 0 ? "docs" : "home";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
